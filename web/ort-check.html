<!-- Browser workbench. Options in the address bar:
       ?ver=1.29.0   which onnxruntime-web build to load
       ?suffix=.web  which model copy to try (".web" = the cleaned copy, "" = as exported)
       ?only=mel     skip the big model while testing loading
     Not the finished site. -->
<title>Model check</title>
<style>
  body { font: 13px ui-monospace, Menlo, monospace; background: #14110f; color: #eee7db; margin: 0; padding: 24px; }
  h1 { font: 600 18px system-ui, sans-serif; margin: 0 0 4px; }
  p.sub { color: #9b9289; margin: 0 0 16px; }
  button { font: 500 14px system-ui, sans-serif; background: #d2624a; color: #fff; border: 0; border-radius: 8px; padding: 9px 16px; cursor: pointer; }
  #log { white-space: pre-wrap; line-height: 1.6; margin-top: 16px; }
  .ok { color: #8fd18f; } .bad { color: #ef8d7a; } .dim { color: #9b9289; }
</style>
<h1>Clavinova model check</h1>
<p class="sub" id="sub"></p>
<button id="run">Run the check</button>
<div id="log"></div>
<script type="module">
  const params = new URLSearchParams(location.search);
  const VER = params.get("ver") || "1.29.0";
  const SUFFIX = params.get("suffix") ?? ".web";
  const ONLY = params.get("only") || "";
  const SR = 44100, HOP = 1024, WIN = 4096, SEG = 16;          // the model's native chunk

  document.querySelector("#sub").textContent =
    `onnxruntime-web ${VER}, models "${SUFFIX || "as exported"}"${ONLY ? `, only ${ONLY}` : ""}`;

  const log = (m, cls = "") => document.querySelector("#log").insertAdjacentHTML("beforeend", `<div class="${cls}">${m}</div>`);
  const mb = (n) => (n / 1e6).toFixed(1) + " MB";
  const why = (e) => {
    const parts = [e && e.message, typeof e === "string" ? e : null, e && e.name, String(e)];
    const first = parts.find((p) => p && p !== "undefined" && p !== "[object Object]");
    return String(first || JSON.stringify(e)).split("\n")[0].slice(0, 300);
  };

  let ort;
  async function runtime() {
    if (!ort) {
      const base = `https://cdn.jsdelivr.net/npm/onnxruntime-web@${VER}/dist/`;
      ort = await import(base + "ort.webgpu.min.mjs");
      ort.env.wasm.wasmPaths = base;                 // the runtime's own support files
      ort.env.wasm.numThreads = navigator.hardwareConcurrency || 4;
      ort.env.logLevel = "warning";
    }
    return ort;
  }

  async function load(label, file, backend) {
    const o = await runtime();
    try {
      const r = await fetch(file);
      if (!r.ok) throw new Error(`HTTP ${r.status} for ${file}`);
      const bytes = new Uint8Array(await r.arrayBuffer());
      const t = performance.now();
      const sess = await o.InferenceSession.create(bytes, { executionProviders: [backend], graphOptimizationLevel: "all" });
      log(`  ${label}: ${mb(bytes.length)}, ready in ${Math.round(performance.now() - t)} ms`, "ok");
      return sess;
    } catch (e) {
      log(`  ${label}: ${why(e)}`, "bad");
      return null;
    }
  }

  document.querySelector("#run").onclick = async () => {
    document.querySelector("#log").innerHTML = "";
    const o = await runtime();
    log(`onnxruntime-web ${VER}; WebGPU available: ${"gpu" in navigator ? "yes" : "no"}`);
    if ("gpu" in navigator) {
      const a = await navigator.gpu.requestAdapter();
      log(`  biggest single block of GPU memory ${mb(a?.limits?.maxStorageBufferBindingSize ?? 0)}`, "dim");
    }
    const segSamples = Math.ceil(SEG * SR);
    const nFrames = Math.ceil(segSamples / HOP) + 1;
    log(`one ${SEG} second chunk = ${nFrames} frames of ${WIN} samples\n`);

    for (const backend of ["webgpu", "wasm"]) {
      log(`== ${backend} ==`);
      const mel = await load("audio features", `models/mel${SUFFIX}.onnx`, backend);
      if (!mel) { log(""); continue; }
      let melT = null, melMs = 0;
      try {
        const frames = new Float32Array(2 * nFrames * WIN);
        for (let i = 0; i < frames.length; i++) frames[i] = (Math.random() - 0.5) * 0.1;
        const runs = [];
        for (let i = 0; i < 3; i++) {
          const t = performance.now();
          const out = await mel.run({ frames: new o.Tensor("float32", frames, [1, 2, nFrames, WIN]) });
          runs.push(performance.now() - t);
          melT = out[Object.keys(out)[0]];
        }
        melMs = Math.min(...runs.slice(1));
        log(`  audio features runs: ${runs.map((r) => Math.round(r) + " ms").join(", ")} -> ${melT.dims.join("x")}`, "ok");
      } catch (e) {
        log(`  audio features failed to run: ${why(e)}`, "bad");
      }
      if (ONLY === "mel" || !melT) { log(""); continue; }
      const bb = await load("backbone", `models/backbone${SUFFIX}.onnx`, backend);
      if (!bb) { log(""); continue; }
      try {
        const runs = [];
        let ctx = null;
        for (let i = 0; i < 3; i++) {                      // the first run includes one-time warm-up
          const t = performance.now();
          const out = await bb.run({ mel: melT });
          runs.push(performance.now() - t);
          ctx = out[Object.keys(out)[0]];
        }
        log(`  backbone runs: ${runs.map((r) => Math.round(r) + " ms").join(", ")} -> ${ctx.dims.join("x")} (${mb(ctx.data.length * 4)})`, "ok");
        const bbMs = Math.min(...runs.slice(1));

        // The scorer runs once per group of 9 pitches, 10 groups per chunk.
        const sc = await load("scorer (9 pitches)", `models/scorer${SUFFIX}.onnx`, backend);
        let scMs = 0;
        if (sc) {
          const P = 9, T = ctx.dims[2], D = ctx.dims[3];
          const slice = new Float32Array(P * T * D);
          slice.set(ctx.data.subarray(0, P * T * D));
          const scRuns = [];
          for (let i = 0; i < 3; i++) {
            const t = performance.now();
            const out = await sc.run({ ctx: new o.Tensor("float32", slice, [P, T, D]) });
            scRuns.push(performance.now() - t);
            if (i === 0) log(`  scorer -> ${out[Object.keys(out)[0]].dims.join("x")} (${mb(out[Object.keys(out)[0]].data.length * 4)} per group)`, "dim");
          }
          scMs = Math.min(...scRuns.slice(1));
          log(`  scorer runs: ${scRuns.map((r) => Math.round(r) + " ms").join(", ")}, 10 groups per chunk = ${Math.round(scMs * 10)} ms`, "ok");
        }
        const perChunk = melMs + bbMs + scMs * 10;
        log(`  settled total ${Math.round(perChunk)} ms per 16 s chunk ` +
            `(features ${Math.round(melMs)}, backbone ${Math.round(bbMs)}, scorer ${Math.round(scMs * 10)})`, "ok");
        log(`  so the model part of a 4 minute song takes about ${(perChunk * (240 / (SEG / 2)) / 1000).toFixed(0)} s here, ` +
            `before the note finding that JavaScript does`, "ok");
      } catch (e) {
        log(`  backbone failed to run: ${why(e)}`, "bad");
      }
      log("");
    }
    log("done");
  };
</script>
