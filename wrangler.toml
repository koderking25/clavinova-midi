# Cloudflare deployment for the website (midify.tech).
#
# The site lives in web/, not at the top of the repo, which is why a plain deployment
# of this repository serves nothing at "/". This file points Cloudflare at web/ so that
# "/" is web/index.html.
#
# IMPORTANT: "name" has to match the Worker you already created, or Cloudflare will make
# a second one. Rename it here if yours is called something else.
name = "midify"
compatibility_date = "2026-09-12"

# A static site: no server code of our own. Every page and every model file is a file
# on Cloudflare's network, which is why the whole thing costs nothing to run.
[assets]
directory = "./web"
not_found_handling = "404-page"
